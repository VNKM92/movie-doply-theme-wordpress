<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c518" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="750" fill="url(#bgGrad)" />
  <circle cx="250" cy="300" r="220" fill="url(#glow)" />

  <!-- Grid Accents -->
  <path d="M0,0 L500,750 M500,0 L0,750" stroke="rgba(255,255,255,0.02)" stroke-width="1" />
  <rect x="25" y="25" width="450" height="700" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="8,6" />

  <!-- Film Strip Top & Bottom Decor -->
  <g fill="rgba(255,255,255,0.08)">
    <rect x="35" y="35" width="16" height="12" rx="2" />
    <rect x="60" y="35" width="16" height="12" rx="2" />
    <rect x="85" y="35" width="16" height="12" rx="2" />
    <rect x="395" y="35" width="16" height="12" rx="2" />
    <rect x="420" y="35" width="16" height="12" rx="2" />
    <rect x="445" y="35" width="16" height="12" rx="2" />

    <rect x="35" y="700" width="16" height="12" rx="2" />
    <rect x="60" y="700" width="16" height="12" rx="2" />
    <rect x="85" y="700" width="16" height="12" rx="2" />
    <rect x="395" y="700" width="16" height="12" rx="2" />
    <rect x="420" y="700" width="16" height="12" rx="2" />
    <rect x="445" y="700" width="16" height="12" rx="2" />
  </g>

  <!-- Central Cinema Icon & Play Circle -->
  <circle cx="250" cy="300" r="70" fill="#111827" stroke="url(#primaryGrad)" stroke-width="3" />
  <circle cx="250" cy="300" r="55" fill="rgba(229, 9, 20, 0.15)" />
  <polygon points="240,275 272,300 240,325" fill="#ffffff" />

  <!-- 4K UHD Quality Badge -->
  <rect x="190" y="405" width="120" height="30" rx="15" fill="url(#goldGrad)" />
  <text x="250" y="425" fill="#000000" font-size="14" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="1">4K ULTRA HD</text>

  <!-- Typography -->
  <text x="250" y="485" fill="#ffffff" font-size="24" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="0.5">CINEMA STREAM</text>
  <text x="250" y="515" fill="#94a3b8" font-size="14" font-weight="500" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="0.5">Official High-Definition Poster</text>

  <!-- Rating Stars Simulation -->
  <g fill="url(#goldGrad)" transform="translate(180, 540) scale(0.9)">
    <polygon points="10,1 13,7 19,7 14,11 16,17 10,13 4,17 6,11 1,7 7,7" />
    <polygon points="35,1 38,7 44,7 39,11 41,17 35,13 29,17 31,11 26,7 32,7" />
    <polygon points="60,1 63,7 69,7 64,11 66,17 60,13 54,17 56,11 51,7 57,7" />
    <polygon points="85,1 88,7 94,7 89,11 91,17 85,13 79,17 81,11 76,7 82,7" />
    <polygon points="110,1 113,7 119,7 114,11 116,17 110,13 104,17 106,11 101,7 107,7" />
  </g>

  <!-- Bottom Brand Watermark -->
  <text x="250" y="660" fill="rgba(255,255,255,0.4)" font-size="12" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="2">UNLIMITED FAST STREAMING</text>
</svg>
